server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Статика
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси на бэкенд API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Прокси на эндпоинты бэкенда (без префикса /api)
    location /upload {
        proxy_pass http://backend:8000/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }

    location /update-coords/ {
        proxy_pass http://backend:8000/update-coords/;
        proxy_set_header Host $host;
    }

    location /models {
        proxy_pass http://backend:8000/models;
        proxy_set_header Host $host;
    }

    location /select-model {
        proxy_pass http://backend:8000/select-model;
        proxy_set_header Host $host;
    }

    # Прокси на ML-сервис
    location /ml/ {
        proxy_pass http://ml-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
